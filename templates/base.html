<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>Issue Reporter</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav>
  <a class="brand" href="{{ url_for('chat_page') }}"><span class="logo">✦</span>Issue Reporter</a>
  {% if g.user %}
    <a class="link {{ 'active' if request.endpoint == 'chat_page' }}" href="{{ url_for('chat_page') }}">Report</a>
    <a class="link {{ 'active' if request.endpoint in ('issues', 'issue_detail') }}" href="{{ url_for('issues') }}">{{ 'All issues' if g.user.role in STAFF_ROLES else 'My issues' }}</a>
    <span class="spacer"></span>
    <span class="userbox"><span class="avatar">{{ g.user.username[0] }}</span><span class="name">{{ g.user.username }}</span><span class="badge">{{ g.user.role }}</span></span>
    <form method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="ghost">Log out</button></form>
  {% endif %}
</nav>
<main>
  {% for m in get_flashed_messages() %}<p class="flash">{{ m }}</p>{% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
